server {
    listen      80;
    access_log  /var/log/nginx/stream.access.log;
    error_log   /var/log/nginx/stream.error.log;

    root        /var/www/stream_root;
    index       index.html;

    sendfile    on;
    tcp_nopush  on;

    location /video/ {
        try_files $uri =404;
        open_file_cache 1000 60s;

        location ~* \.m3u8$ {
            expires off;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location ~* \.ts$ {
            expires 10s;
        }

        location ~* \.jpg$ {
            expires 1h;
        }
    }
}
