server {
    listen      80;
    access_log  /var/log/nginx/stream.access.log;
    error_log   /var/log/nginx/stream.error.log;

    root        /var/www/stream_root;
    index       index.html;

    # 画面(index.html / stream.js)に日本語の表示文言があるため、文字コードを明示する
    charset     utf-8;

    sendfile    on;
    tcp_nopush  on;

    # 稼働状況(空き容量・ffmpegの状況)。画面が1分ごとに参照するため常に最新を返す
    location = /status.json {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 書き込み途中の一時ファイル(status.json.tmp など)は配信しない
    location ~ \.tmp$ {
        deny all;
    }

    location /video/ {
        try_files $uri =404;
        open_file_cache 1000 60s;

        # ログ・PID・ロック等の内部ファイルは配信しない(認証情報が含まれ得る)
        location ~ /\. {
            deny all;
        }
        location ~* \.(log|pid|lock|tmp)$ {
            deny all;
        }

        location ~* \.m3u8$ {
            expires off;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location ~* \.ts$ {
            expires 10s;
        }

        location ~* \.jpg$ {
            expires 1h;
        }
    }
}
